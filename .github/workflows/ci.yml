name: MMV2 GDExtension CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'godot/**'
      - 'SConstruct'
      - 'mmv2.gdextension'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # BUILD - Windows
  # ============================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup SCons
        run: pip install scons

      - name: Clone godot-cpp
        run: git clone --depth 1 --branch 4.2-stable https://github.com/godotengine/godot-cpp.git

      - name: Build MMV2
        run: |
          scons platform=windows target=${{ matrix.target }} arch=${{ matrix.arch }} -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmv2-windows-${{ matrix.target }}-${{ matrix.arch }}
          path: demo/bin/*.dll

  # ============================================
  # BUILD - macOS
  # ============================================
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup SCons
        run: pip install scons

      - name: Clone godot-cpp
        run: git clone --depth 1 --branch 4.2-stable https://github.com/godotengine/godot-cpp.git

      - name: Build MMV2
        run: |
          scons platform=macos target=${{ matrix.target }} -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmv2-macos-${{ matrix.target }}
          path: demo/bin/*.framework

  # ============================================
  # BUILD - Linux
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup SCons
        run: pip install scons

      - name: Clone godot-cpp
        run: git clone --depth 1 --branch 4.2-stable https://github.com/godotengine/godot-cpp.git

      - name: Build MMV2
        run: |
          scons platform=linux target=${{ matrix.target }} arch=${{ matrix.arch }} -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmv2-linux-${{ matrix.target }}-${{ matrix.arch }}
          path: demo/bin/*.so

  # ============================================
  # STATIC ANALYSIS
  # ============================================
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --std=c++20 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            -I include \
            src/ 2>&1 | tee cppcheck-report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: cppcheck-report.txt
