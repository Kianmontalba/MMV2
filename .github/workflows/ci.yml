name: MMV2 GDExtension CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - run: git clone --depth 1 --branch 4.2 https://github.com/godotengine/godot-cpp.git
      - run: scons platform=windows target=${{ matrix.target }} arch=${{ matrix.arch }} -j4
      - uses: actions/upload-artifact@v4
        with:
          name: mmv2-windows-${{ matrix.target }}-${{ matrix.arch }}
          path: demo/bin/*.dll

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - run: git clone --depth 1 --branch 4.2 https://github.com/godotengine/godot-cpp.git
      - run: scons platform=macos target=${{ matrix.target }} -j4
      - uses: actions/upload-artifact@v4
        with:
          name: mmv2-macos-${{ matrix.target }}
          path: demo/bin/*.framework

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - run: git clone --depth 1 --branch 4.2 https://github.com/godotengine/godot-cpp.git
      - run: scons platform=linux target=${{ matrix.target }} arch=${{ matrix.arch }} -j4
      - uses: actions/upload-artifact@v4
        with:
          name: mmv2-linux-${{ matrix.target }}-${{ matrix.arch }}
          path: demo/bin/*.so

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - run: git clone --depth 1 --branch 4.2 https://github.com/godotengine/godot-cpp.git
      - run: scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} -j4
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: mmv2-android-${{ matrix.target }}-${{ matrix.arch }}
          path: demo/bin/*.so

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cppcheck
      - run: cppcheck --enable=all --std=c++20 --suppress=missingIncludeSystem --suppress=unusedFunction -I include src/ 2>&1 | tee cppcheck-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: cppcheck-report.txt
